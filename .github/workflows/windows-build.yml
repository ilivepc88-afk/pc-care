name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PcCare.sln

      - name: Build
        run: dotnet build PcCare.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/PcCare.Core.Tests/PcCare.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish full offline executable
        run: dotnet publish src/PcCare.App/PcCare.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/offline

      - name: Publish lightweight executable
        run: dotnet publish src/PcCare.App/PcCare.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishTrimmed=false -p:EnableCompressionInSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -o artifacts/lite

      - name: Create checksums and size summary
        shell: pwsh
        run: |
          foreach ($edition in @("offline", "lite")) {
            $exe = "artifacts/$edition/PcCare.exe"
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  PcCare.exe" | Set-Content "artifacts/$edition/PcCare.exe.sha256" -Encoding ascii
            $size = (Get-Item $exe).Length
            "- ${edition}: $size bytes" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
            Copy-Item artifacts/offline/PcCare.exe "artifacts/release/PcCare-$tag-win-x64-offline.exe"
            Copy-Item artifacts/offline/PcCare.exe.sha256 "artifacts/release/PcCare-$tag-win-x64-offline.exe.sha256"
            Copy-Item artifacts/lite/PcCare.exe "artifacts/release/PcCare-$tag-win-x64-lite.exe"
            Copy-Item artifacts/lite/PcCare.exe.sha256 "artifacts/release/PcCare-$tag-win-x64-lite.exe.sha256"
          }

      - name: Upload full offline executable
        uses: actions/upload-artifact@v4
        with:
          name: PcCare-win-x64-offline
          path: |
            artifacts/offline/PcCare.exe
            artifacts/offline/PcCare.exe.sha256
          if-no-files-found: error

      - name: Upload lightweight executable
        uses: actions/upload-artifact@v4
        with:
          name: PcCare-win-x64-lite
          path: |
            artifacts/lite/PcCare.exe
            artifacts/lite/PcCare.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## PcCare Windows 发布包

            - `offline`：完整离线版，无需预装 .NET 10 Desktop Runtime。
            - `lite`：轻量版，需要预装 .NET 10 Desktop Runtime x64。
            - 下载后请使用同名 `.sha256` 文件校验完整性。
          files: |
            artifacts/release/*.exe
            artifacts/release/*.sha256
