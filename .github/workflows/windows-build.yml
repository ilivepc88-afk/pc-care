name: Windows build and signed release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      unsigned_artifact_id: ${{ steps.upload_unsigned.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tagged version metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/PcCare.App/PcCare.App.csproj"
          $version = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          if ($version -ne $tagVersion) {
            throw "Project Version '$version' must match tag '${{ github.ref_name }}'."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PcCare.sln

      - name: Build
        run: dotnet build PcCare.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/PcCare.Core.Tests/PcCare.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish full offline executable
        run: dotnet publish src/PcCare.App/PcCare.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/unsigned/offline

      - name: Publish lightweight executable
        run: dotnet publish src/PcCare.App/PcCare.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishTrimmed=false -p:EnableCompressionInSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -o artifacts/unsigned/lite

      - name: Upload unsigned release bundle for SignPath
        id: upload_unsigned
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pccare-unsigned-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            artifacts/unsigned/offline/PcCare.exe
            artifacts/unsigned/lite/PcCare.exe
          if-no-files-found: error

      - name: Create unsigned build checksums
        shell: pwsh
        run: |
          foreach ($edition in @("offline", "lite")) {
            $exe = "artifacts/unsigned/$edition/PcCare.exe"
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  PcCare.exe" | Set-Content "artifacts/unsigned/$edition/PcCare.exe.sha256" -Encoding ascii
            "- unsigned ${edition}: $((Get-Item $exe).Length) bytes" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload unsigned verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PcCare-unsigned-win-x64-${{ github.run_id }}
          path: |
            artifacts/unsigned/offline/PcCare.exe
            artifacts/unsigned/offline/PcCare.exe.sha256
            artifacts/unsigned/lite/PcCare.exe
            artifacts/unsigned/lite/PcCare.exe.sha256
          if-no-files-found: error

  sign-and-release:
    name: Sign with SignPath and create release
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write

    steps:
      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build-test.outputs.unsigned_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed

      - name: Create signed checksums and release files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $entries = @(
            @{ Edition = "offline"; Source = "artifacts/signed/offline/PcCare.exe" },
            @{ Edition = "lite"; Source = "artifacts/signed/lite/PcCare.exe" }
          )

          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          foreach ($entry in $entries) {
            if (-not (Test-Path $entry.Source)) {
              throw "Expected signed artifact was not returned by SignPath: $($entry.Source)"
            }

            $name = "PcCare-$tag-win-x64-$($entry.Edition).exe"
            $target = Join-Path artifacts/release $name
            Copy-Item $entry.Source $target
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content "$target.sha256" -Encoding ascii
            "- signed $($entry.Edition): $((Get-Item $target).Length) bytes" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload signed verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PcCare-signed-win-x64-${{ github.ref_name }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## PcCare Windows 发布包

            - 两个 EXE 均由 SignPath Foundation 签名；请在 Windows 文件属性的“数字签名”页验证发布者和签名状态。
            - `offline`：完整离线版，无需预装 .NET 10 Desktop Runtime。
            - `lite`：轻量版，需要预装 .NET 10 Desktop Runtime x64。
            - 下载后请使用同名 `.sha256` 文件校验完整性。
            - 签名策略见仓库根目录的 `CODE_SIGNING_POLICY.md`。
          files: |
            artifacts/release/*.exe
            artifacts/release/*.sha256
