name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PcCare.sln

      - name: Build
        run: dotnet build PcCare.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/PcCare.Core.Tests/PcCare.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish portable executable
        run: dotnet publish src/PcCare.App/PcCare.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/publish

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/publish/PcCare.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PcCare.exe" | Set-Content artifacts/publish/PcCare.exe.sha256 -Encoding ascii

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PcCare-win-x64
          path: |
            artifacts/publish/PcCare.exe
            artifacts/publish/PcCare.exe.sha256
          if-no-files-found: error
